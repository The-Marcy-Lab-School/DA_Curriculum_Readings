      [SCRIPT] One real caution on the visualizer, worth saying out loud: a plan
      you paste in is uploaded and stored on their server. Perfectly fine for
      class data. Never paste a plan from an employer's database into it - the
      site also offers a standalone version you can download and run locally,
      which is the right answer at work.


      [SCRIPT] The `COALESCE` article is the one to send anyone who wants more
      than today's two examples - it walks several patterns for choosing a
      fallback, which is exactly the judgment half of today's lesson.
