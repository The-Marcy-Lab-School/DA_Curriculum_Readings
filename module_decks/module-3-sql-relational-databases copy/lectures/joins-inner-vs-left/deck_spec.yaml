        description: "Clear breakdown of every join type, with real examples"
        attribution: "W3Schools"
      - title: "SQLBolt"
        url: "https://sqlbolt.com/"
        kind: practice
        time_estimate: "~15 min hands-on"
        description: "The same free interactive lessons from yesterday"
        attribution: "SQLBolt"
