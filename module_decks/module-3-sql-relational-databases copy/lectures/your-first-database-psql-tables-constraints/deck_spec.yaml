meta:
  title: "Your First Database: psql, Tables & Constraints"
  module: "Module 3: SQL & Relational Databases"
  module_number: 3
  lesson_number: 2
  date: "Day 2"
  instructor: "Instructor: J. Sprattley"
  learning_objectives:
    - "Create a PostgreSQL database and a table with correct column types and constraints (NOT NULL, PRIMARY KEY, FOREIGN KEY) via psql, following a step-by-step template"
    - "Write basic SELECT, WHERE, and ORDER BY queries against a real table"
  tools:
    - "PostgreSQL / psql"
  exercise:
    type: bullets
    url_or_text: "No new exercise today — the same create/insert/query steps you just typed for real are exactly what the project's own sprint later asks you to do independently."
    uses_same_scenario_as_lecture: false
  dependent_skills:
    - "Yesterday: Primary keys, foreign keys, normalization (1NF, 2NF, 3NF)"
    - "Terminal/command-line comfort (Modules 0-2)"
  interview_topics:
    - "Why enforce data rules with database constraints (NOT NULL, CHECK) instead of relying only on application code?"
  final_project:
    "Early in the project's own sprint, you'll confirm psql is running and
    actually connecting, on your own machine, before anything else.
    Shortly after, you'll write your own schema.sql with real
    constraints. Today is the first real, typed rep of both, on a dataset
    you'll never touch again once the project starts."
  module_plan_ref: "module_sources/module-3-sql-relational-databases/INSTRUCTOR_MODULE_SUMMARY.md"
  module_dataset_ref: "module_sources/module-3-sql-relational-databases/DATASET.md"
  scaffolding_level: guided
  scenario: >
    Real syntax, for the first time this module: A small NYC restaurant
    inspection database, typed by hand at a real `psql` prompt. You'll
    create a database, build two real tables with real constraints, load
    a few rows, and query them back — the exact moves this module's
    project will ask you to do on your own, unguided, in a few weeks.
  glossary:
    - term: "psql"
      definition: "PostgreSQL's own command-line client — how you'll run every query this module"
    - term: "constraint"
      definition: "A rule attached to a column that the database itself enforces on every insert or update"
    - term: "NOT NULL constraint"
      definition: "Requires a column to always have a real value — never left blank"
    - term: "CHECK constraint"
      definition: "Restricts a column's values to a specific, allowed set or condition"

slides:
  - type: title
    title: "Your First Database"
    subtitle: "psql, Tables & Constraints"
    module: "Module 3: SQL & Relational Databases"
    date: "Day 2"
    notes: >
      [SCRIPT] Frame this as the real tool day — yesterday was design
