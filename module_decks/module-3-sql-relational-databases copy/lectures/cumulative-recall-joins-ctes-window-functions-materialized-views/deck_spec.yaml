        attribution: "Danny Ma"
    notes: >
      [SCRIPT] All three are free and none needs an account. Point at the Metabase
      article for anybody who wants the written version of today's inflated count -
      it walks the same one-to-many join chain and is the clearest explanation of it
      anywhere, video included.


      [SCRIPT] The PostgreSQL page is the primary source behind the stale-view
      demonstration, and it is honest about the tradeoff rather than selling the
      feature: stored data is much faster to read and is not always current.


      [SCRIPT] The practice challenge is the strongest pick for anybody who wants a
      real rep before the build starts. It hands over ten business questions against
      one small relational schema, which is the same shape as the project, and its
      browser editor runs PostgreSQL specifically, so the syntax matches what has
      been typed all module. One honest caveat to say out loud: the questions,
      schema and editor are free, but the author's own written solutions sit behind
      a paid course. Plenty of free community write-ups exist for anyone who gets
      genuinely stuck.
