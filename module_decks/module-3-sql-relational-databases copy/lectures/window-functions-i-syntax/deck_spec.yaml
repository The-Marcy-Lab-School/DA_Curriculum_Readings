  date: "Day 7"
  instructor: "Instructor: J. Sprattley"
  learning_objectives:
    - "Explain how a window function differs from GROUP BY - every row stays, and a computed value is added beside it"
    - "Write a window function using RANK() or ROW_NUMBER() with an OVER (ORDER BY ...) clause"
  tools:
    - "PostgreSQL / psql"
  exercise:
    type: bullets
    url_or_text: "No new exercise today - your project's own window-function question needs exactly this syntax, on your own schema's real numbers."
    uses_same_scenario_as_lecture: false
  dependent_skills:
    - "Yesterday: Chaining multiple CTEs together in one WITH clause"
    - "Earlier this module: ORDER BY, and GROUP BY aggregation"
  interview_topics:
    - "Clarifying an ambiguous 'top N' request before writing a ranking query, and choosing RANK() vs. ROW_NUMBER() based on how ties should be handled"
  final_project:
    "The project's own window-function question needs a real RANK()/ROW_NUMBER()
    ranking query, spot-checked against known values - exactly today's syntax,
