  - type: framework_columns
    title: "Four Questions Before You **Pick a Library**"
    anchor:
      label: "The Question"
      prompt: "\"Which one should this script use, and why that one?\""
    panels:
      - marker: "01"
        label: "Lifespan"
        prompt: "Runs once, or runs all day?"
      - marker: "02"
        label: "Control"
        prompt: "Do you need the driver's exact behavior?"
      - marker: "03"
        label: "Reach"
        prompt: "Could this ever point at another database?"
      - marker: "04"
        label: "Shape"
        prompt: "Do you want rows, or Python objects?"
    notes: >
      [SCRIPT] Walk all four, and after each one say which part of today
      answered it. Lifespan is the two process-id cells: repetition is what
      makes a pool pay. Control is the error row: a raw driver hands you the
      database's own complaint. Reach is the cell where one string changed.
      Shape is the ORM row, which is the one most people have never had to think
      about.


      [SCRIPT] Point out what is deliberately missing from these four. There is
      no question about which library is better, which is more professional, or
      which is more popular. Every question is about the script. That is the
      whole method.


      [SCRIPT] Say the project tie explicitly and out loud, because this slide is
      the deliverable in disguise. The project asks for a written tradeoff
      comparison reasoned from what you actually experienced. These four
      questions are its outline: one short paragraph each, answered for your own
      script, and it is written.


      [MISCONCEPTIONS] People will want a scoring rule, like "three out of four
      means SQLAlchemy." Refuse it. Two of these can point in opposite
      directions for the same script, and saying which one you weighted most and
      why is the actual answer an interviewer is listening for.

  - type: check_understanding
    prompt: "A nightly script runs one query, prints one number, and exits. Which library, and what is the strongest reason?"
    mode: game
    topic: "Recommending for One Script"
    bloom_level: evaluate
    question_style: interview
    technique: "PREP"
    options:
      - "`psycopg2`, since one query gains nothing from a pool"
      - "SQLAlchemy, since pooling is always the safer default"
      - "Either one, since the choice never matters at this size"
    answer:
      correct: "`psycopg2`, since one query gains nothing from a pool"
      explanation: "A script that opens once, asks once, and exits has no second query to reuse a connection, so the pool that made the earlier cell impressive does nothing here. The strongest reason names the script's lifespan, not the library's reputation. The tempting wrong answer, that pooling is always the safer default, is the exact belief this lesson is built to break. Saying the choice never matters is wrong for a different reason, because it does have a consequence: whoever inherits this script has to learn whichever layer you left behind. Either library would run correctly here, which is precisely why the reasoning is what gets graded."
      source: "This lesson's own four-question framework, applied to the script's lifespan"
    skill_tags: ["python", "psycopg2", "sqlalchemy"]
    notes: >
      [TECHNIQUE] Use PREP, Point then Reason then Example then Point. A
      recommendation question is exactly the shape PREP is for: state the pick
      first, give the reason, give one concrete consequence, then restate the
      pick. Coach whoever answers to open with the verdict rather than narrating
      their thinking for thirty seconds and arriving at one. An interviewer is
      listening for the pick up front.


      [ACTIVITY] Quick-fire game: read all three, count down from three out
      loud, then everyone calls out A, B, or C at the same time. Online:
      everyone types A, B, or C in chat on the count of three so nobody copies
      the first answer posted. Use the letters the slide shows, not numbers.
      Then have one person deliver the full answer in PREP shape before you
      reveal it.


      [SCRIPT] Do not stop at the correct letter. Ask the room what would have
      to change about this script to flip the answer, and take two responses.
      Runs every ten minutes instead of nightly. Asks eight questions instead of
      one. Might get pointed at a different database next quarter. Any of those
      genuinely moves the recommendation, and being able to say so is the whole
      objective.


      [MISCONCEPTIONS] Some will read option A as "psycopg2 is better for small
      things," which is a rule rather than reasoning. Correct it to the version
      that survives an interview: nothing about the size is the point, only that
      one query cannot reuse a connection there is no second question for.

  - type: interview_prep
    topics:
      - question: "How would you connect a Python script to Postgres, and what would make you reach for SQLAlchemy over the raw driver?"
        short_answer: "Question: Is this a one-off analysis script, or something that runs continuously? Assumption: I will assume a scheduled job against one Postgres database, with the credential read from the environment. Risk: If it turns out to be a long-running service, a raw driver opening a connection per request is exactly what runs a database out of slots, and that is the case where I reach for an engine and its pool."
        technique: "QAR"
        icon: "api"
      - question: "Explain connection pooling to someone who does not write code."
        short_answer: "Audience: Someone approving the work, not reading the code. Simplify: Opening a link to a database is slow, and the database only allows so many at once. Analogy: It is the rack of loaner rackets at a gym, taken and put back, instead of buying a new one every game. Check: So if I say we reuse a few links instead of making a new one every time, does that land?"
        technique: "Teach-Back"
        icon: "cycle"
    notes: >
      [TECHNIQUE] The first one uses QAR, Question then Assumption then Risk,
      because it is genuinely underspecified as asked. The honest answer depends
      on facts the interviewer has not given, so the strong move is to ask for
      one of them, state the assumption you are running on, and name what breaks
      if the assumption is wrong. Coach people to chain PREP after QAR once the
      ambiguity is resolved: state the pick, the reason, the example, the pick
      again.


      [TECHNIQUE] The second uses Teach-Back, Audience then Simplify then
      Analogy then Check. The step almost everyone drops is the last one.
      Finishing with a real check, rather than trailing off, is what separates
      explaining from lecturing, and interviewers notice it.


      [SCRIPT] [~52 min mark] If you are already past 54 minutes, show the
      answers and skip the cold attempt. Otherwise have someone attempt the
      first one cold before advancing. Keep the register serious here even
      though the rest of today is energetic.


      [SCRIPT] Be honest about how these get asked, because overselling them
      would be a disservice. Nobody is likely to ask a junior analyst to pick
      between two Postgres drivers by name. What is genuinely common is the
      shape underneath: how do you connect Python to a database safely, and what
      would make you use SQLAlchemy rather than raw SQL. Say that out loud, and
      say the same about the second one: "explain a technical concept to a
      non-technical audience" is a very common data-analyst question, and
      connection pooling is simply a hard thing to practise it on, not something
      you should expect to be quizzed on directly.


      [SOURCES] The first question's shape is verified in circulation:
      interviewprep.org's SQLAlchemy question bank asks "What are the benefits
      of using SQLAlchemy for database manipulation over raw SQL queries?", and
      Datavidhya's 2026 Python-for-data-engineers list asks "How do you connect
      Python to a SQL database safely?" with SQLAlchemy and psycopg2 named
      together in its own model answer. The second question's wrapper is
      verified on DataCamp's data-analyst interview guide, which lists "How do
      you communicate technical concepts to a non-technical audience?" directly.
      Connection pooling itself is a well-catalogued question in backend, DBA,
      and system-design banks rather than analyst ones, which is exactly why the
      script above frames it as practice material and not as a prediction.

