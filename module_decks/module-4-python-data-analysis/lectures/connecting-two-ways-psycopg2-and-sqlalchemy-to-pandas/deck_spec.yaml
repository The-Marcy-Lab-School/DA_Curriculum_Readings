meta:
  title: "Connecting Two Ways, psycopg2 and SQLAlchemy to pandas"
  module: "Module 4: Python Data Analysis"
  module_number: 4
  lesson_number: 2
  date: "Day 2"
  instructor: "Instructor: J. Sprattley"
  learning_objectives:
    - "Open a real PostgreSQL connection with `psycopg2` and load the rows into a pandas DataFrame"
    - "Run the same query through SQLAlchemy and confirm both paths return the same DataFrame"
    - "Write connection code that is safe to commit, with no typed-in password and no connection left open"
  tools:
    - "Python"
  exercise:
    type: bullets
    url_or_text: "Redo today's four notebook cells from the blank student notebook. Then point a real `DATABASE_URL` at the database you built in the SQL module and run both connection paths against it, confirming they return the same DataFrame."
    uses_same_scenario_as_lecture: false
  dependent_skills:
    - "A pandas DataFrame's rows, columns, and `dtype`, and how they map onto a SQL table (the lesson before this one)"
    - "SQL: `SELECT`, `WHERE`, `GROUP BY`, and a real PostgreSQL database you built yourself (the SQL module)"
    - "Reading and running cells in a Jupyter notebook, and a working Python install (Modules 0-1)"
    - "Basic `try`/`except`/`finally` exception handling (Module 1's error-handling lesson)"
  interview_topics:
    - "Walk me through how you would connect a Python script to a production database safely and pull the results into pandas."
    - "A teammate's daily script starts failing with a `too many connections` error. How would you investigate?"
  final_project:
    "The project's connect-and-compare day is exactly today's work on your own
    database. One real query runs through both `psycopg2` and SQLAlchemy, both
    confirmed to return the same result, credentials read from an environment
    variable, and every connection released. Two of the four mistakes that
    project is explicitly graded against, a typed-in password and a connection
    nobody closed, are the two habits today builds."
  module_plan_ref: "module_sources/module-4-python-data-analysis/INSTRUCTOR_MODULE_SUMMARY.md"
  module_dataset_ref: "module_sources/module-4-python-data-analysis/DATASET.md"
  scaffolding_level: guided
  estimated_duration_min: 60
  scenario: >
    You are back on the city agency's data team, and the CSV export you
    worked from last class is already stale. The service requests you need
    live in a PostgreSQL table called `service_requests`, updated all day
    long. Today you stop exporting and start connecting: you open a real
    connection from Python, pull the same NYC 311 rows straight out of the
    live table into a pandas DataFrame, do it a second time through a
    different library, and prove the two agree.
  notebook_warmup:
    prompt: "Last class a date came out of a CSV as plain text. If those same rows arrive over a live database connection instead, does the type still get lost?"
    hint: "A CSV file stores only characters. Ask yourself what else a database knows about a column that a file never had a place to write down."
  glossary:
    - term: "connection"
      definition: "An open, live link between your Python program and a running database"
    - term: "cursor"
      definition: "The psycopg2 object you send SQL through and read rows back from"
    - term: "driver"
      definition: "The library that actually speaks a specific database's own language"
    - term: "engine"
      definition: "SQLAlchemy's reusable connection manager for one database"
    - term: "environment variable"
      definition: "A value your computer holds for a program, stored outside the code"

