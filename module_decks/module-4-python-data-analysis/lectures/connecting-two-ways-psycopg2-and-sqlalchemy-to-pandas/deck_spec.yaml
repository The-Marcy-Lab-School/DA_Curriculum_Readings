      - text: "driver"
        icon: "api"
      - text: "engine"
        icon: "settings"
      - text: "environment variable"
        icon: "lock"
    notes: >
      [SCRIPT] Names only for now. Every one of these gets a real definition
      and a real example before today is over, and all five come back with
      their definitions on the recap slide at the end.


      [MISCONCEPTIONS] Two of these sound like the same thing and are not. A
      `connection` is the open link itself. A `cursor` is what you actually
