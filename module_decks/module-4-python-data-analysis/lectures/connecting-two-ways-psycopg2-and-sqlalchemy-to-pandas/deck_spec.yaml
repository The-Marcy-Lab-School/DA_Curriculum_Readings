  - type: check_understanding
    prompt: "Quick recall: Last class, a real `TIMESTAMP` column came out of a CSV as plain text. What did the file fail to carry?"
    mode: discussion
    topic: "Warm-Up: What a File Loses"
    bloom_level: remember
    question_style: conceptual
    skill_tags: ["python", "dtypes"]
    notes: >
      [ACTIVITY] In person: quick shout-outs, no hands, just call it out.
      Online: drop answers in chat, then unmute one or two people to say it
      out loud. 60 seconds, no longer.


      [SCRIPT] Looking for the type, the schema, the column's declared type.
      Any of those wordings counts. Then say exactly why this is today's
      warm-up rather than trivia: the whole reason a live connection is
      better than an export is that a connection carries the thing a file
      could not. In about twenty minutes you will watch that same date come
      back as a real date, with nothing converted by hand.


      [MISCONCEPTIONS] Someone will answer "the data" or "some rows." Redirect
      gently: every row and every value survived the export perfectly. What
      did not survive was the database's own description of what those
      characters mean.

  - type: transition
    from_label: "You Know What an Export Loses"
    to_label: "Now See What a Leaked Connection Costs"
    note: "A connection carries more than a file can, and that power comes with two responsibilities nobody sees until they are skipped."
    objective_index: 1
    style: "icon_hero"
    icon: "warning"
    notes: >
      [SCRIPT] [~7 min mark] Short beat. Frame the case study as the reason
      today spends real time on the boring half of connecting, not just the
      fun half.

  - type: case_study
    headliner: "One Key Typed Into the Code. **Five Years** Exposed."
    kicker: "IN THE NEWS"
    summary_points:
      - "An access key written into code"
      - "Public repo, unnoticed for five years"
      - "296,019 records potentially reachable"
    is_fictional: false
    source_url: "https://www.bleepingcomputer.com/news/security/toyota-discloses-data-leak-after-access-key-exposed-on-github/"
    caption: "BleepingComputer, October 2022"
    image_path: "modules/module-4-python-data-analysis/lectures/connecting-two-ways-psycopg2-and-sqlalchemy-to-pandas/images/slide_06_case_study.png"
    image_prompt: "Photo-realistic: Developer at a monitor reviewing exposed source code, serious"
    image_alt: "A software developer at a monitor showing source code with a credential visible in it, the kind of key that was left in a public repository for years"
    hook_question: "A password typed straight into a file makes the script work today. What could that cost later, and who would even notice?"
    domain: "business_operations"
    notes: >
      [SCRIPT] Walk the mechanism, because the mechanism is the whole point
      and it is embarrassingly small. Somebody working on a car company's
      connected-car app needed the app to reach a data server. They typed the
      access key straight into the source file, because that works. Then that
      source file was pushed to a public code repository, where anybody on the
      internet could read it.


      [SCRIPT] Land the ending, which is the part that gets a reaction. It sat
      there for almost five years before anyone noticed. When they finally
      did, the company disclosed that just under 300,000 customers' email
      addresses and management numbers had been reachable that entire time,
      and said plainly that it could not rule out that someone had used it.


      [SCRIPT] Be precise rather than dramatic about what leaked. Names, phone
      numbers, and card data were not in that database. This is not a
      worst-case breach story. It is a story about a single line of code, and
      that is what makes it usable: it is a mistake anyone in this room could
      make this afternoon, in the exact code being written today.


      [SCRIPT] Do not resolve the hook yet. Ask it, take a few answers, and
      say that today's own code will meet the fix for this in about half an
      hour, and that the project is graded on it.


      [ARTICLE SUMMARY] In December 2017 a subcontractor working on Toyota's
      T-Connect app pushed part of the app's source code to a public GitHub
      repository, and that code contained a hardcoded access key for the data
      server holding customer information. Nobody noticed the repository was
      public until September 15, 2022, nearly five years later. Toyota
      disclosed on October 7, 2022 that the email addresses and customer
      management numbers of 296,019 people had been reachable that whole time.
      Names, phone numbers, and credit card data were not stored in that
      database. Toyota made the repository private and replaced the exposed
      credentials, but said it could not completely rule out unauthorized
      access.


      [SOURCES] Bill Toulas, "Toyota discloses data leak after access key
      exposed on GitHub," BleepingComputer, 2022-10-07,
      bleepingcomputer.com/news/security/toyota-discloses-data-leak-after-access-key-exposed-on-github/.
      Corroborated by GitGuardian's own writeup,
      blog.gitguardian.com/toyota-accidently-exposed-a-secret-key-publicly-on-github-for-five-years/.
      Toyota's own newsroom page for the disclosure is no longer reachable, so
      cite the two above rather than the vendor page.

  - type: content
    title: "`psycopg2` Is the Library That **Speaks Postgres**"
    bullets:
      - "A driver that talks to one database"
      - "It speaks PostgreSQL's own language"
      - "The most widely used Postgres adapter"
      - "SQLAlchemy sits on top of it"
    icon_hero:
      icon: "api"
      style: "gold"
    notes: >
      [SCRIPT] Answer what, why, and who, in that order, before anyone types
      an import. What: `psycopg2` is a driver, which means a library whose
      entire job is speaking one specific database's own language. Why:
      Python has no idea how to talk to PostgreSQL on its own, and something
      has to do the translating. Who: it is the most widely used PostgreSQL
      adapter in Python, it is what this module's own project environment
      installs, and it is what the other library today quietly uses
      underneath.


      [SCRIPT] Draw the layering out loud and slowly, because the wrong
      picture of it is the most predictable confusion in this whole lesson.
      Your code sits on top. Under it, the second library you meet today.
      Under that, `psycopg2`. Under that, PostgreSQL itself. The second
      library is not another road to the database. It is a layer above the
      same one.


      [SCOPE] Name the word `driver` properly here and then stop. Which
      library to reach for, and why, is next class's entire lesson. Today
      you only need to know that one of them talks to the database directly
      and the other one goes through it.


      [MISCONCEPTIONS] "Driver" sounds like a person or a car part, and
      people who have installed a printer driver assume it is an operating
      system thing. Same word, same idea, different place: a driver is
      whatever knows how to speak to one specific piece of software or
      hardware on your behalf. Here, the specific thing is PostgreSQL.


      [SOURCES] psycopg2's own documentation describes it as "the most
      popular PostgreSQL database adapter for the Python programming
      language," a complete implementation of the Python DB API 2.0
      specification, "mostly implemented in C as a libpq wrapper" — libpq
      being PostgreSQL's own C client library, which is what "speaks
      PostgreSQL's own language" means concretely (psycopg.org/docs).

  - type: workflow_linear
    title: "Closing Is the Beat **People Skip**"
    steps:
      - label: "Connect"
        detail: "`.connect()`"
        icon: "database"
      - label: "Ask"
        detail: "`.execute()`"
        icon: "sql"
      - label: "Read"
        detail: "`.fetchall()`"
        icon: "data_frame"
      - label: "Close"
        detail: "`.close()`"
        icon: "task_complete"
    analogy:
      domain: "food"
      mapping: "A table at a packed restaurant. Camping there after you pay keeps the next party waiting outside."
      backups:
        - domain: "gaming"
          mapping: "Holding a slot in a full lobby after you stop playing. Nobody else can join until you leave."
        - domain: "sports"
          mapping: "A court at a busy rec center. Sign it out, play, then sign it back in, or the next team waits."
    notes: >
      [SCRIPT] Name the analogy before the vocabulary, then attach the terms.
      A restaurant with every table full is exactly the shape of this. Being
      seated takes real time. The meal is the part you came for. And the
      table is not yours forever, because somebody is waiting on it.


      [SCRIPT] Now make it literal, because the analogy is unusually accurate
      here and that is why it is worth spending a minute on. A PostgreSQL
      connection is not a lightweight thing. The server starts a real
      operating-system process for each one, with its own memory. There is a
      hard ceiling on how many can exist at once, set by the server, and the
      default ceiling is small enough that a handful of leaky scripts really
      can use it up. Then the next connection request does not slow down. It
      is refused.


      [SCRIPT] Walk the four beats left to right and say which line of code
      each one is, since the next two slides are literally this diagram typed
      out. Connect opens the link. Ask sends the SQL. Read pulls the rows
      back. Close hands the table back.


      [MISCONCEPTIONS] The most common belief in this room today will be that
      step four is optional politeness, like closing a file you are done
      reading. It is not the same. A file you forget costs your own program a
      little memory. A connection you forget costs the shared server a slot
      that nobody else can use, and there is a fixed number of slots.


      [OTHER EXAMPLES] If the restaurant framing does not land, the notebook
      carries two backups: a slot in a full game lobby, and a court signed
      out at a rec center.


      [SOURCES] The cost claim is real and worth stating accurately.
      PostgreSQL's own architecture documentation says the server "starts
      ('forks') a new process for each connection," so a connection is a real
      operating-system process, not a lookup
      (postgresql.org/docs/current/tutorial-arch.html). Its configuration
      documentation sets `max_connections` at a default of 100 and notes that
      PostgreSQL "sizes certain resources based directly on the value of
      max_connections," including shared memory
      (postgresql.org/docs/current/runtime-config-connection.html). One
      honest caveat the analogy undersells, worth saying out loud but not
      putting on the slide: a tied-up phone line only inconveniences people
      calling you, while a leaked database connection eats from a
      server-wide budget and can lock out other teams entirely.

  - type: transition
    from_label: "You Know the Four Beats"
    to_label: "Code Along: Type Them Out with `psycopg2`"
    note: "The diagram is four boxes. In real code it is four lines, and one of them is the one people forget."
    style: "panel_preview"
    preview_items:
      - text: "Open a real connection"
        icon: "database"
      - text: "Read the rows back"
        icon: "data_frame"
    notes: >
      [SCRIPT] [~15 min mark] Everyone opens the notebook now and keeps it
      open. Confirm out loud that the shared `DATABASE_URL` is already set in
      everyone's environment before typing starts, because a room half of
      whom cannot connect will lose ten minutes here.

  - type: code
    title: "A Cursor Is What You **Send SQL Through**"
    language: python
    terminal_label: "analysis"
    code: |
      import os
      import psycopg2

      conn = psycopg2.connect(os.environ["DATABASE_URL"])
      cur = conn.cursor()

      sql = "SELECT * FROM service_requests LIMIT 5"
      cur.execute(sql)
      rows = cur.fetchall()
      print(rows[0])
    starter_code: |
      import os
      import psycopg2

      # TODO: open a connection using DATABASE_URL
      conn = ...
      cur = conn.cursor()

      sql = "SELECT * FROM service_requests LIMIT 5"

      # TODO: send the query, then read every row back
      ...
      rows = ...
      print(rows[0])
    code_along: true
    domain: "public_sector"
    domain_note: "`service_requests` is the same NYC 311 data as last class, this time living in a real PostgreSQL table instead of a file."
    doc_url: "https://www.psycopg.org/docs/usage.html"
    skill_tags: ["python", "sql", "psycopg2", "database-connection"]
    notes: >
      [ACTIVITY] Everyone runs this cell and confirms they see one tuple
      printed before anyone moves on. Online: thumbs-up reaction rather than
      reading names out.


      [SCRIPT] Go line by line, because every one of these four lines is a
      concept, not syntax. `os.environ["DATABASE_URL"]` reads a value your
      computer is holding outside this file, which is objective three arriving
      early on purpose. `psycopg2.connect()` opens the real link. `conn.cursor()`
      gives you the thing you actually send SQL through. `cur.execute()` sends
      it, and `cur.fetchall()` brings every row back.


      [SCRIPT] Point at the printed output before saying anything else about
      it. It is a plain Python tuple. No column names anywhere. Ask the room
      what is missing compared to a DataFrame, and let them notice it
      themselves rather than telling them.


      [SCRIPT] Say the honest thing about the URL: today everyone points at
      one shared class database so the room stays in sync. On the project you
      will point the exact same variable at your own database, and not one
      line of this code changes.


      [MISCONCEPTIONS] People merge `connect` and `cursor` into one idea.
      Separate them out loud: the connection is the open line to the server,
      the cursor is one conversation happening on that line. You can run
      several cursors on one connection, which is exactly why they are two
      objects and not one.


      [MISCONCEPTIONS] Somebody will ask why the query is a plain string
      rather than something more Python-shaped. Answer it directly and briefly:
      `psycopg2` is a driver, so it hands your SQL to PostgreSQL essentially
      untouched. That is the whole point of a driver, and it is also the first
      real difference from the library coming up next.

  - type: code
    title: "Tuples In, a **Real DataFrame** Out"
    language: python
    terminal_label: "analysis"
    code: |
      import pandas as pd

      cols = [d[0] for d in cur.description]
      df = pd.DataFrame(rows, columns=cols)

      print(df.head(3))
      print(df["created_date"].dtype)

      cur.close()
      conn.close()
    starter_code: |
      import pandas as pd

      # TODO: the rows came back with no column names.
      # Get them off the cursor, then rebuild the table.
      ...

      print(df.head(3))

      # TODO: print the type of the created_date column
      ...

      # TODO: release the cursor, then the connection
      ...
      ...
    code_along: true
    domain: "public_sector"
    doc_url: "https://www.psycopg.org/docs/cursor.html#cursor.description"
    skill_tags: ["python", "pandas-io", "database-connection"]
    notes: >
      [ACTIVITY] Run it, then have the room read the second printed line out
      loud together. That one line is the payoff for the whole first half of
      the lesson.


      [SCRIPT] Do the DataFrame construction first. `cur.description` is the
      cursor's own record of the query it just ran, one entry per column, and
      the first item in each entry is that column's name. `d[0] for d in
      cur.description` is just "give me each column's name." Then
      `pd.DataFrame(rows, columns=cols)` puts values and names back together.


      [SCRIPT] Now the payoff, and slow all the way down here. Last class,
      `created_date` came out of a CSV as text and needed
      `pd.to_datetime()` to become a real date. Read the printed dtype out
      loud. It is a real datetime, and nobody converted anything. The type
      survived because a connection carries the schema and a file cannot.
      That is the answer to today's warm-up question, arriving as running
      code rather than as a claim.


      [SCRIPT] Then the two closing lines. Cursor first, then connection.
      Say plainly that this is the step the case study was about, and that
      the next section makes it bulletproof rather than merely remembered.


      [MISCONCEPTIONS] `cur.description` reads like documentation, so people
      assume it is a docstring or a help message. It is not. It is structured
      metadata about the last query the cursor ran, and it is the standard way
      every Python database library exposes column names. Two precisions if
      anyone digs: it always describes the most recent query, not all of them,
      and the second item in each entry is a database-specific type code, not
      a Python type, so do not let anyone read it as a `dtype`.


      [MISCONCEPTIONS] A few people will see text columns print as `object`
      rather than `str` and think something broke. Nothing broke. Older
      pandas labels a text column `object`; newer pandas labels it `str`.
      Both mean text, and the column everyone should actually be looking at
      today is `created_date`.


      [SOURCES] Verified by running this exact code against a real
      PostgreSQL 16 table holding this module's own NYC 311 sample:
      `created_date` comes back as `datetime64[us]`, `unique_key` as
      `int64`. Column names via `cursor.description` are standard Python
      DBAPI behavior: PEP 249 defines `.description` as a sequence of
      seven-item sequences, one per result column, of which `name` and
      `type_code` are the two mandatory items (peps.python.org/pep-0249/).

  - type: check_understanding
    prompt: "`cur.fetchall()` handed back plain tuples with no column names attached. So where did the DataFrame's column names come from?"
    mode: poll
    topic: "Where Column Names Live"
    bloom_level: understand
    question_style: conceptual
    options:
      - "`cur.description`, the cursor's own record of the last query"
      - "pandas guessed them by looking at the values"
      - "They were still attached to the tuples, just hidden"
    answer:
      correct: "`cur.description`, the cursor's own record of the last query"
      explanation: "Every Python database cursor keeps a `description` of the query it just ran, one entry per column, and the first item in each entry is that column's name. `fetchall()` returns only values, so putting the names back on is a separate step you do yourself. That extra step is the price of using a raw driver, and it is exactly what the next section removes."
      source: "Python DBAPI 2.0 specification (PEP 249), `cursor.description`, plus psycopg2's own cursor documentation"
    skill_tags: ["python", "psycopg2"]
    notes: >
      [ACTIVITY] Poll: read all three options, count hands on each, then
      reveal. Online: have everyone type A, B, or C in chat before anyone
      explains. Say the letters, not numbers, since the slide itself labels
      the options A, B, and C. 45 seconds.


      [SCRIPT] Option two is the interesting wrong answer, not option three.
      pandas genuinely does guess plenty of things from values, including
      every column's type. It just cannot guess a name, because a name is not
      in the data. Say that out loud, because it is the same idea as last
      class's file-versus-schema point wearing different clothes.

  - type: transition
    from_label: "One Way Works"
    to_label: "The Same Query, Written the Other Way"
    note: "`psycopg2` handed you tuples and left the assembling to you. SQLAlchemy hands the finished DataFrame straight to pandas."
    objective_index: 2
    notes: >
      [SCRIPT] [~28 min mark] Pivot cleanly. Do not editorialize on which
      library is better yet. Today's job is that both work and both agree;
      deciding between them is next class's whole lesson.

  - type: content
    title: "SQLAlchemy Gives You an **Engine**, Not a Connection"
    bullets:
      - "A Python toolkit for talking to databases"
      - "An `engine` hands out connections for you"
      - "For Postgres, `psycopg2` runs underneath"
      - "pandas reads from it in one call"
    icon_hero:
      icon: "settings"
      style: "blue"
    analogy:
      domain: "travel"
      mapping: "A rideshare still drives a real car. Someone else just handles the driving for you."
      backups:
        - domain: "music"
          mapping: "A guitar plugged straight into an amp versus through a pedalboard. Same guitar, same amp, more handled for you."
        - domain: "food"
          mapping: "Buying the ingredients versus ordering the dish. The same kitchen cooks it either way."
    notes: >
      [SCRIPT] Answer what, why, and who, in that order, before any code.
      What: SQLAlchemy is a Python toolkit for working with databases, and
      the piece you meet today is the `engine`, which knows where your
      database is and hands out connections when something asks for one. Why:
      because pandas reads directly from it, so the tuples-plus-column-names
      assembly you just did by hand disappears into one call. Who: it is one
      of the most widely used database libraries in professional Python, and
      it is what the project's own given connection module uses.


      [SCRIPT] Land the third bullet hard, because it is the single most
      misunderstood fact in this lesson. SQLAlchemy is not a competitor to
      `psycopg2`, and it is not a replacement for it. It is a layer that sits
      on top and, for PostgreSQL, uses `psycopg2` underneath by default. The
      rideshare is still driving a real car.


      [SCRIPT] Say the bullet's scope precisely rather than rounding it off.
      SQLAlchemy always uses some driver underneath; which one depends on the
      database. For PostgreSQL the default is `psycopg2`, and alternatives
      like `psycopg` version 3 or `asyncpg` can be named instead. Point at a
      different database and the default driver is a different library
      entirely. "SQLAlchemy uses psycopg2" is only true for Postgres, and
      only by default.


      [SCOPE] Today is what an engine is and how to get a DataFrame out of
      one. SQLAlchemy also has a whole object-relational layer where you
      define Python classes that map onto tables. Do not open that today. The
      real comparison of when each library fits is next class's entire
      lesson, and the object-relational layer shows up only as an optional
      stretch goal on the project.


      [MISCONCEPTIONS] "Engine" sounds like the thing that runs the query. It
      does not. PostgreSQL runs the query. The engine manages the pool of
      connections your code borrows from, which is why creating one engine
      and reusing it is normal, while creating a new one per query is not.


      [SOURCES] SQLAlchemy's own 2.0 documentation: the `Engine` is "'home
      base' for the actual database and its DBAPI, delivered to the
      SQLAlchemy application through a connection pool and a Dialect," and
      "the PostgreSQL dialect uses psycopg2 as the default DBAPI"
      (docs.sqlalchemy.org/en/20/core/engines.html). psycopg2's own docs
      describe it as "the most popular PostgreSQL database adapter," a
      complete implementation of the Python DB API 2.0 specification and a
      wrapper around Postgres' own C client library (psycopg.org/docs).

  - type: transition
    from_label: "You Know What an Engine Is"
    to_label: "Code Along: Let pandas Do the Fetching"
    note: "One call is about to replace the cursor, the fetch, and the column names you assembled by hand."
    notes: >
      [SCRIPT] Back into the same notebook, next cell down. Nobody restarts
      anything: the `sql` string and the `df` from the first half are still
      needed for the comparison at the end of this cell.

  - type: code
    title: "The Same Question, in **One Line of pandas**"
    language: python
    terminal_label: "analysis"
    code: |
      from sqlalchemy import create_engine

      engine = create_engine(os.environ["DATABASE_URL"])

      with engine.connect() as connection:
          df2 = pd.read_sql(sql, connection)

      print(df2.head(3))
      print("Same as psycopg2?", df.equals(df2))
    starter_code: |
      from sqlalchemy import create_engine

      # TODO: build an engine from the same DATABASE_URL
      engine = ...

      with engine.connect() as connection:
          # TODO: let pandas run sql and hand back a DataFrame
          df2 = ...

      print(df2.head(3))
      print("Same as psycopg2?", df.equals(df2))
    code_along: true
    domain: "public_sector"
    doc_url: "https://pandas.pydata.org/docs/reference/api/pandas.read_sql.html"
    skill_tags: ["python", "sqlalchemy", "database-connection"]
    notes: >
      [ACTIVITY] Everyone runs it and calls out what the last line printed.
      You want to hear `True` from the whole room. If anyone gets `False`,
      they almost certainly ran a different query than the `sql` variable
      from earlier, which is worth surfacing rather than skipping.


      [SCRIPT] Count the lines out loud against the previous two slides. Four
      steps became one call, and `pd.read_sql` did the fetching and the
      column names together. Then name what the `with` block bought: the
      connection is handed back automatically at the end of the block, so
      there is no close to forget here.


      [SCRIPT] The last printed line is the whole point of the lesson title.
      `df.equals(df2)` is not comparing values loosely. It checks shape,
      column names, and every column's type. Getting `True` means the two
      libraries produced genuinely identical DataFrames, including the real
      datetime column, not just similar-looking output.


      [SCRIPT] Say the URL detail once, because it will look like magic
      otherwise: the exact same `DATABASE_URL` string worked for both
      libraries. A URL starting `postgresql://` with no driver named
      defaults to `psycopg2`, so this line is quietly using the library from
      the first half of the lesson. Worth one extra clause: that default only
      works because `psycopg2` is installed, which is why plenty of teams
      write the driver into the URL explicitly.


      [MISCONCEPTIONS] People will want to hand `pd.read_sql` the bare
      `psycopg2` connection from earlier instead of a SQLAlchemy connection.
      It appears to work, and then prints a warning saying pandas only
      supports a SQLAlchemy connectable, a database string, or a sqlite3
      connection, and that other objects are not tested. Say what pandas
      actually does next, because it is the concrete reason to care: it falls
      back to its SQLite code path and runs your Postgres connection through
      that. Demonstrate it if there is time, because "it ran and only warned"
      is exactly the kind of thing people learn to scroll past.


      [SOURCES] Verified by running this exact code against a real
      PostgreSQL 16 table holding this module's own NYC 311 sample, with
      SQLAlchemy 2.0 and pandas: `df.equals(df2)` printed `True`, and passing
      a raw psycopg2 connection to `pd.read_sql` emitted pandas' documented
      UserWarning about untested DBAPI2 objects. pandas' own `read_sql`
      reference states that if a DBAPI2 object is passed, "only sqlite3 is
      supported"
      (pandas.pydata.org/docs/reference/api/pandas.read_sql.html), and
      pandas' source falls back to its SQLite handler after warning.
      SQLAlchemy's own docs confirm the driverless `postgresql://` form
      defaults to psycopg2 (docs.sqlalchemy.org/en/20/core/engines.html).

  - type: check_understanding
    prompt: "On your board, draw both paths from the same SQL string to the same DataFrame. Mark every place the two genuinely differ."
    mode: whiteboard
    topic: "Two Paths, One DataFrame"
    bloom_level: analyze
    question_style: critical_thinking
    skill_tags: ["python", "psycopg2", "sqlalchemy"]
    notes: >
      [ACTIVITY] Whiteboard, in pairs, five minutes. In person: one shared
      board or a sheet of paper per pair, then two pairs hold theirs up and
      walk it. Online: a shared Padlet, Jamboard, or FigJam board, one frame
      per pair, then screen-share two of them. Ask for drawings rather than
      sentences, but say out loud that a written or spoken step-by-step list
      of the two paths counts exactly the same as a drawing, so nobody is
      shut out of an analyze-level beat by the format. When a pair presents,
      have them narrate what they drew rather than only pointing at it.


      [SCRIPT] Steer toward the differences that are actually in the code
      they just typed, not toward opinions. Real differences to fish for:
      `psycopg2` needs a cursor and SQLAlchemy does not expose one here; the
      column names have to be recovered by hand on one side and arrive
      attached on the other; closing is manual on one side and automatic
      inside the `with` block on the other. Real sameness to name: the SQL
      string is identical, the connection URL is identical, the resulting
      DataFrame is identical, and SQLAlchemy is using `psycopg2` under there
      the whole time.


      [SCOPE] Do not let this turn into "so which one should we use." That is
      genuinely next class's entire lesson, with real scenarios to judge
      against. Say that out loud and park the question rather than answering
      it thinly today.


      [MISCONCEPTIONS] Several boards will show SQLAlchemy as a completely
      separate road to the database. Correct it while walking the room, and
      then draw the authoritative version on the shared board during the
      debrief rather than only correcting it pair by pair: your code, then
      SQLAlchemy, then `psycopg2`, then PostgreSQL, stacked, not side by
      side. That is the same picture the driver slide named earlier, and
      seeing it drawn once correctly after trying to draw it themselves is
      what makes it stick.

  - type: transition
    from_label: "It Runs"
    to_label: "Now Make It Safe to Commit"
    note: "Code that runs and code you can push to a public repo are two different bars, and a password and an open connection are what separate them."
    objective_index: 3
    style: "icon_hero"
    icon: "lock"
    notes: >
      [SCRIPT] [~40 min mark] Last section, and the one the project grades
