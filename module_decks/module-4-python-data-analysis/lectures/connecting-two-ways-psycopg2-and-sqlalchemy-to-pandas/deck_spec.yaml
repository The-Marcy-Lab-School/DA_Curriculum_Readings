  - type: content
    title: "Your Password Belongs **Outside** Your Code"
    bullets:
      - "Never type a password into a file"
      - "Read it from the environment instead"
      - "One string holds host, user, database"
      - "Rotate the secret, never touch code"
    image_path: "modules/module-4-python-data-analysis/lectures/connecting-two-ways-psycopg2-and-sqlalchemy-to-pandas/images/slide_18_env_var.png"
    image_prompt: "Flat illustration: A key kept beside a code file, never written inside it"
    image_alt: "A code file with no password written in it, next to a separate key held outside the file, showing credentials living in the environment rather than in source code"
    image_caption: "The code stays public, the key does not"
    analogy:
      domain: "community"
      mapping: "A community center's door code is given out privately, never painted on the door itself."
      backups:
        - domain: "family"
          mapping: "Where the spare key actually lives is something you get told, not something taped to the front door."
        - domain: "social_media"
          mapping: "Your account password is not in your bio. The app holds it somewhere the public page never shows."
    notes: >
      [SCRIPT] Introduce the analogy before the term. A community center with
      its door code painted on the door has not secured anything, and worse,
      changing the code means repainting the door. Then attach the real word:
      an environment variable is a value your computer holds for a program,
      stored outside the program's own files.


      [SCRIPT] Walk what `DATABASE_URL` actually is, since everyone typed it
      twice already without being told. It is one string holding where the
      database lives, who is connecting, and the password, in a standard
      shape both libraries understand. The string is the sensitive thing. The
      code that reads it is not.


      [SCRIPT] Name the payoff that makes this more than a rule to follow.
      When the secret lives outside the code, rotating it is a one-line
      change to an environment, not a code change, a commit, and a review.
      And your notebook can be public while the credential is not.


      [MISCONCEPTIONS] The most common belief here is that a private repo
      makes hardcoding fine. Push back concretely: a repo's visibility can be
      flipped by anyone with access, repos get forked, and a secret in git
      history survives deleting the line, because the old commit still has
      it. The habit is what protects you, not the setting.


      [MISCONCEPTIONS] People also assume an environment variable is
      encrypted. It is not. It is a value the operating system holds for your
      process. What it buys you is that it lives outside the file you commit
      and share, which is the actual thing that goes wrong.


      [SCOPE] Be honest that this is the baseline, not the ceiling, and then
      stop. An environment variable is a large improvement over a typed-in
      password and it is exactly what the project grades. Production teams
      usually go one step further and use a dedicated secrets manager,
      because environment variables can still end up in logs and crash dumps.
      Name that in one sentence so nobody leaves thinking this is the most
      secure thing that exists, then move on. Secrets management is not this
      module's topic.


      [SOURCES] The practice being taught here is the Twelve-Factor App's
      Config factor, which calls storing config as constants in code "a
      violation" and asks for config in environment variables, "easy to
      change between deploys without changing any code" (12factor.net/config).
      The caveat above is OWASP's own Secrets Management Cheat Sheet, which
      notes environment variables "are generally accessible to all processes
      and may be included in logs or system dumps"
      (cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html)
      — cite Twelve-Factor for the practice, and OWASP only for the "there is
      a next level" note, never as an endorsement of environment variables.

  - type: transition
    from_label: "The Secret Is Handled"
    to_label: "Code Along: Closing It Every Single Time"
    note: "Reading the password safely is only half of safe. The other half is releasing the connection even when the query fails."
    style: "panel_preview"
    preview_items:
      - text: "Wrap the work in `try`"
        icon: "code"
      - text: "Close it in `finally`"
        icon: "task_complete"
    notes: >
      [SCRIPT] Last cell of the day. Tell everyone this one is a
      fill-in-the-blank, so they should read it before typing rather than
      copying straight through.


      [SCRIPT] Give the reasoning before they fill anything in, not after,
      or the blank gets answered from memory instead of from thinking. Say
      it plainly: a query can raise, and a network can drop. If the close
      sits on the last line and the line above it throws, the close never
      runs and the connection is stranded. So the question the blank is
      really asking is: which Python block runs no matter what happened
      above it?

  - type: code
    title: "Open It in a `try`, and **Always** Close It"
    language: python
    terminal_label: "analysis"
    code: |
      conn = psycopg2.connect(os.environ["DATABASE_URL"])

      try:
          with conn.cursor() as cur:
              cur.execute(sql)
              rows = cur.fetchall()
      finally:
          conn.close()

      print(len(rows), "rows, connection closed")
    blanked_code: |
      conn = psycopg2.connect(os.environ["DATABASE_URL"])

      try:
          with conn.cursor() as cur:
              cur.execute(sql)
              rows = cur.fetchall()
      ____:
          conn.____()

      print(len(rows), "rows, connection closed")
    code_along: true
    domain: "public_sector"
    doc_url: "https://www.psycopg.org/docs/connection.html#connection.close"
    skill_tags: ["python", "psycopg2", "connection-cleanup"]
    notes: >
      [ACTIVITY] Fill in the blank, 30 seconds, before advancing to the
      answer. In person: someone says both missing pieces out loud. Online:
      everyone types them in chat at the same time on a count of three. This
      slide is deliberately the one cell with no `starter_code`, so the
      student notebook shows the exact same two blanks the slide does rather
      than a different exercise.


      [SCRIPT] Heads up on the error anyone gets if they run the cell before
      filling it in: a `try` with nothing after it is a `SyntaxError`, not a
      runtime error, so Python refuses to run the cell at all and points at
      the wrong line. That is not a broken notebook. Say it before anyone
      panics, and note that the error message names exactly what is missing.


      [SCRIPT] After the reveal, explain why `finally` and not just a close
      at the end. A query can raise. A network can drop. If the close sits on
      the last line and the line above it throws, the close never runs and
      the connection is stranded. `finally` runs either way, which is exactly
      what "always" means here.


      [SCRIPT] Point out that the cursor gets a `with` block and the
      connection does not. That asymmetry is deliberate and it is the single
      most useful thing on this slide, so do not rush it.


      [MISCONCEPTIONS] This is the big one, and it catches experienced people
      too. Writing `with conn:` around the work does not close the
      connection. In `psycopg2`, a connection used as a context manager
      commits or rolls back the transaction when the block ends, and then
      leaves the connection open on purpose so you can reuse it. You still
      have to call `conn.close()` yourself. If there is time, prove it live:
      run a `with conn:` block, then print `conn.closed` and watch it print
      zero. `psycopg2`'s own documentation calls this out under a warning
      heading, and its successor library's migration guide describes the old
      behavior as "surprising," so nobody should feel slow for missing it.


      [MISCONCEPTIONS] Someone will argue the connection closes when the
      script ends anyway. For a small script that finishes, that is broadly
      true. It stops being true the moment the code lives in a notebook that
      stays open for hours, a scheduled job that loops, or anything running
      as a service, which is most real analyst code. Do not teach a habit
      that only works in the easiest case.


      [SOURCES] Verified by running it: after a `with conn:` block completed
      normally, `conn.closed` was still `0`, and only an explicit
      `conn.close()` changed it to `1`. psycopg2's own docs state it under a
      Warning heading: "exiting the connection's `with` block doesn't close
      the connection, but only the transaction associated to it. If you want
      to make sure the connection is closed after a certain point, you should
      still use a try-catch block" (psycopg.org/docs/usage.html). Scope note
      for anyone who reads ahead: the successor library, psycopg version 3,
      deliberately changed this, and `with connection` there does close the
      connection (psycopg.org/psycopg3/docs/basic/from_pg2.html). This lesson
      uses psycopg2, which is what the project's own environment installs.

  - type: check_understanding
    prompt: "A teammate's pull request types the password straight into the file and never closes the connection. Which of these do you flag as blocking?"
    mode: game
    topic: "Reviewing Connection Code"
    bloom_level: evaluate
    question_style: interview
    technique: "PREP"
    options:
      - "Both, since one leaks a secret and one leaks a resource"
      - "Only the password, since a connection closes itself"
      - "Neither, as long as the script runs"
    answer:
      correct: "Both, since one leaks a secret and one leaks a resource"
      explanation: "The typed-in password is a secret that lands in the repository and stays in its history even if the line is later deleted, so it has to be replaced with an environment variable before this merges. The unclosed connection is more forgiving in a script that exits quickly, because the process ending does release it, but in a notebook, a scheduled job, or a service it holds a real server-side slot indefinitely, and a database has a fixed number of those. Both are the kind of thing that runs perfectly in review and fails in production."
      source: "This module's own project rubric, which grades both a hardcoded credential and an unreleased connection against the `python` skill"
    skill_tags: ["python", "connection-cleanup", "code-review"]
    notes: >
      [TECHNIQUE] Use PREP, Point then Reason then Example then Point. A code
      review verdict is exactly the shape PREP is for: state the call first,
      say why, give one concrete consequence, then restate the call. Coach
      whoever answers to lead with "both, and here is which one I would fix
      first," rather than narrating their thinking and arriving at a verdict
      thirty seconds later. An interviewer is listening for the verdict up
      front.


      [ACTIVITY] Quick-fire game: read all three, count down from three out
      loud, then everyone calls out A, B, or C at the same time. Online:
      everyone types A, B, or C in chat on the count of three, so nobody just
      copies the first answer posted. Use the letters the slide itself shows
      rather than numbers, and say them out loud rather than relying on a
      show of hands, so nobody has to read the room to take part.


      [SCRIPT] Do not stop at the right answer. Ask whoever answered why
      option two is genuinely tempting, because it is half right, and getting
      that nuance out loud is the difference between a memorized rule and
      real judgment. A short script really does release its connection when
      the process ends. An interviewer is asking whether you know why that
      stops being true.


      [MISCONCEPTIONS] Some people rank the unclosed connection as harmless
      because nothing visibly breaks. Say what the failure actually looks
      like when it does arrive: not a slowdown, but connection requests being
      refused outright once the server's limit is reached, usually to whoever
      connects next rather than to the person who caused it.

  - type: interview_prep
    topics:
      - question: "Walk me through how you would connect a Python script to a production database safely and pull the results into pandas."
        short_answer: "Understand: Which database, which query, and who runs the script. Plan: Read the credentials from the environment, never the file, and use an engine so pandas is on supported ground. Write and explain: Open the connection, run the query, load it with `pd.read_sql`. Validate: Check the row count and column names against what I expected, and confirm the connection was released."
        technique: "Query Walkthrough Method"
        icon: "database"
      - question: "A teammate's daily script starts failing with a `too many connections` error. How would you investigate?"
        short_answer: "Observation: It ran fine for months, and the error names connections, not the query. Hypothesis: Something opens connections without releasing them, until the server hits its limit. Evidence: Count the open connections on the server, then read the code for any path that opens one outside a `try` with a close. Recommendation: Release it in a `finally` block, so it happens even when the query fails."
        technique: "Investigation Framework"
        icon: "warning"
    notes: >
      [TECHNIQUE] The first uses the Query Walkthrough Method, Understand
      then Plan then Write then Explain then Validate, because "walk me
      through how you would" is asking for a narrated plan, not a verdict.
      The strongest version of this answer says the plan out loud before any
      code, and finishes by validating, which is the step most candidates
      drop.


      [TECHNIQUE] The second uses the Investigation Framework, Observation
      then Hypothesis then Evidence then Recommendation, because it is a
      "why did this break" question. The move that separates a strong
      candidate here is naming a hypothesis and then saying what evidence
      would confirm it, rather than jumping straight to a fix that might be
      addressing the wrong cause.


      [SCRIPT] [~50 min mark] If you are already past 52 minutes, cut
      straight to the first question and skip the cold attempt. Otherwise
      have someone attempt the first one cold before showing the
      answer slide. Both of these are real questions at this role level, not
      warm-ups, so keep the register serious here even though the rest of
      today is energetic.


      [SCRIPT] Honest framing worth passing on: the second question is more
      commonly asked as a debugging scenario than as trivia about closing
      connections. Point that out, because it tells people what interviewers
      actually want, which is reasoning about a failure, not a memorized
      rule.

