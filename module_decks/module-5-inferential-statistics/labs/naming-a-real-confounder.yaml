title: "Lab — Naming a Real Confounder"
scaffolding_level: collaborative
follows_lesson_number: 4
skills_tested: ["critical-thinking"]
scenario: >
  You've just found a "significant" difference in a comparison you care
  about. Before you tell anyone it's real, your manager asks the one
  question every stakeholder eventually asks: could something else
  explain this? With a partner, you're handed a real comparison on data
  the lecture never touched, and your job is to name one genuine,
  specific alternative explanation - not a generic "correlation isn't
  causation" gesture - and say what a real controlled design would need
  to actually rule it out.
estimated_minutes:
  intro: 10
  group_work: 60
  shareout: 15
shareout:
  prompt: >
    Go around and have each pair name their confounder out loud - put them
    on the board. Then the real question: was anyone's first instinct too
    generic ("other factors could be involved") before they landed on
    something specific? Ask a few pairs to say the exact number that
    convinced them the confounder was real, not just plausible. Last:
    more than one real confounder can be defensible for the same
    comparison - did any two pairs land on genuinely different, both-
    valid explanations?
steps:
  - title: "Load the Same Dataset, Fresh"
    language: python
    code: |
      import pandas as pd
      from scipy import stats

      df = pd.read_csv("../../data/palmer_penguins.csv")
      df.shape
    skill_tags: ["python", "inferential-statistics"]
    domain_note: "Same `palmer_penguins.csv` from the last three classes, at `../../data/palmer_penguins.csv` from this lab's own folder."
    notes: >
      Confirm the shape is (344, 8) before moving on. Verified against the
      real file 2026-09-12.

  - title: "See the Naive Result First - Don't Explain It Yet"
    language: python
    code: |
      sub = df.dropna(subset=["bill_length_mm", "island"])
      sub.groupby("island")["bill_length_mm"].agg(["mean", "std", "count"])
    skill_tags: ["python", "inferential-statistics", "statistical-analysis"]
    domain_note: "A brand-new outcome variable and grouping this module hasn't compared before - not the body_mass_g/island pairing from Day 4."
    notes: >
      INSTRUCTOR ANSWER KEY, do not reveal in advance: Biscoe mean
      45.26mm (n=167), Dream mean 44.17mm (n=124), Torgersen mean
      38.95mm (n=51). Biscoe vs. Torgersen is a real 6.31mm gap, Welch
      t=11.22, p≈6e-21 - a huge, obviously "significant" naive result.
      With your partner, before running anything else: name one
      candidate reason island itself might not be the real driver. Do
      not confirm or deny any guess yet. Verified against the real file
      2026-09-12.

  - title: "Check Your Candidate - Does It Actually Explain the Gap?"
    language: python
    code: |
      pd.crosstab(df["species"], df["island"])
    student_hint: "If your candidate confounder is a column in this dataset, a real crosstab against island will show you directly whether it lines up with the pattern you're seeing."
    skill_tags: ["python", "inferential-statistics", "critical-thinking"]
    domain_note: "This is the exact same check-the-composition move from Day 4 - just applied here to a candidate you named yourselves, not one the lecture already gave you."
    notes: >
      INSTRUCTOR ANSWER KEY, do not reveal in advance: species is the
      real confounder. Gentoo (the longest-billed species, 47.6mm mean)
      only appears on Biscoe; Torgersen has only Adelie. If a pair
      guesses something else (sex, year), that's a real, testable guess
      too - have them crosstab it against island and see for themselves
      whether it actually lines up as cleanly as species does. Verified
      against the real file 2026-09-12.

  - title: "Recompute the Naive Comparison, Holding Your Candidate Constant"
    language: python
    code: |
      adelie = df[df["species"] == "Adelie"].dropna(subset=["bill_length_mm"])
      adelie.groupby("island")["bill_length_mm"].agg(["mean", "std", "count"])
    student_hint: "Filter down to just one value of whatever candidate you're testing, then rerun the same island comparison - the same move from Day 4."
    skill_tags: ["python", "inferential-statistics", "statistical-analysis"]
    domain_note: "Filtering to one value of your candidate before comparing islands is the actual controlled comparison - not a new technique, the same one from Day 4 applied to a confounder you found yourselves."
    notes: >
      INSTRUCTOR ANSWER KEY, do not reveal in advance: within Adelie
      only, Biscoe mean=38.98mm (n=44), Dream mean=38.50mm (n=56),
      Torgersen mean=38.95mm (n=51) - a 0.02mm gap, Welch t=0.04,
      p=0.97. The naive 6.31mm gap completely vanishes once species is
      held constant. This is, if anything, a cleaner disappearing act
      than Day 4's own body-mass example. Verified against the real
      file 2026-09-12.

  - title: "Write Your Real Call: Name the Confounder, Explain the Design"
    language: python
    code: |
      # In 3-4 sentences: name the specific confounder (not a generic
      # gesture), explain concretely why the naive island comparison
      # doesn't establish that island itself matters, and describe what
      # a real controlled design would need to look like to actually
      # support a causal claim about island.
      print("Confounder named and design described - see notes above.")
    skip_validation: true
    skip_validation_reason: "An open-ended written-reflection step - the point is naming a specific confounder and describing a real controlled design, not a single checkable output."
    skill_tags: ["critical-thinking", "inferential-statistics"]
    notes: >
      Watch specifically for a write-up that says "there could be other
      factors" without naming species specifically, or that stops at
      "species is the confounder" without describing what a real
      controlled design needs (e.g., comparing within the same species
      across islands, as this lab just did, or a design that randomly
      assigns which island a penguin's nest is studied on - acknowledging
      that's not actually possible here, which is itself worth a pair
      noticing and writing down). Every Fellow commits their own
      write-up individually, even while working through the checks with
      a partner.
