  - type: table
    title: "Key Terms — Recap"
    headers:
      - "Term"
      - "Definition"
    rows:
      - - "null hypothesis"
        - "No real difference - only sample noise"
      - - "alternative hypothesis"
        - "A real difference or effect exists"
      - - "p-value"
        - "How surprising this result is, if null were true"
      - - "confidence interval"
        - "Range of plausible values for the true effect"
      - - "minimum detectable effect"
        - "Smallest real effect a study can reliably catch"
    notes: >
      [SCRIPT] Fast round trip before the summary. Ask the room to supply
      "p-value" and "confidence interval" from what they just did, rather
      than reading every row yourself - those two are the pair today's
      whole example was built around.


      [MISCONCEPTIONS] Watch for anyone still defining "p-value" as "the
      probability the null is true" at this recap point - that is the one
      definition worth correcting again, out loud, before moving on.

  - type: bridge
    title: "So far, we've covered..."
    bullets:
      - "Two explanations for any difference you see"
      - "Null and alternative hypothesis, defined for real"
      - "What a p-value actually measures"
      - "Why a huge sample can mislead you"
      - "Statistical significance versus practical significance"
    notes: >
      [SCRIPT] Resolve the case study's hook directly. Would a
      'statistically significant' trial alone be enough to recommend a
      drug to your own grandmother? Not by itself - you'd also want the
      effect size, the confidence interval, and a real judgment about
      whether the size of that effect is worth acting on.


      [SCRIPT] Say the next-class tie out loud. Everything today was the
      logic. Next class runs the real test, in Python, on exactly the
      Gentoo-versus-Adelie comparison you stated a hypothesis for today.


      [SCRIPT] Say the project tie out loud too. Stating your hypothesis
      before running any test, and judging whether a significant result
      is actually big enough to matter, are both graded sections on your
      own project a few weeks from now.

  - type: closing
    title: "Before Next Class Runs the Real Test"
    bullets:
