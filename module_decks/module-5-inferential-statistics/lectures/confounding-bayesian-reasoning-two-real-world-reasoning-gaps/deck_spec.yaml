meta:
  title: "Confounding & Bayesian Reasoning: Two Real-World Reasoning Gaps"
  module: "Module 5: Inferential Statistics"
  module_number: 5
  lesson_number: 4
  date: "Day 4"
  instructor: "Instructor: J. Sprattley"
  learning_objectives:
    - "With a worked example, define what a confounding variable is, and identify a real confounder hiding inside a group comparison"
    - "Explain what a prior and posterior represent, and run a real beta-binomial update on real sequential data"
  tools:
    - "Python"
  exercise:
    type: lab_plan
    url_or_text: "modules/module-5-inferential-statistics/labs/naming-a-real-confounder.md"
    uses_same_scenario_as_lecture: false
  dependent_skills:
    - "Comparing group summary statistics with pandas .groupby() (last two classes)"
    - "Reading a chi-square test's contingency table for association (two classes ago)"
  interview_topics:
    - "What is the difference between correlation and causation?"
  final_project:
    "This lecture rehearses two of the project's own graded sections, at
    reduced stakes: Naming a real confounder for your own comparison
    (section 7), and running a real belief update on your own sequential
    data (section 8)."
  module_plan_ref: "module_sources/module-5-inferential-statistics/INSTRUCTOR_MODULE_SUMMARY.md"
  module_dataset_ref: "module_sources/module-5-inferential-statistics/DATASET.md"
  scaffolding_level: guided
  estimated_duration_min: 65
  scenario: >
    Two habits, both easy to skip under deadline pressure. Before trusting
    a group comparison, check whether something else is secretly driving
    it. Before trusting a belief based on limited data, ask how it should
    change once more data actually arrives. Today is one real worked
    example of each - two genuinely different reasoning gaps, not two
    versions of the same idea.
  glossary:
    - term: "confounding variable"
      definition: "A hidden variable that drives both sides of a comparison, making an association look real or causal when it isn't"
    - term: "prior"
      definition: "Your belief about a true proportion before seeing the data at hand"
    - term: "posterior"
      definition: "Your updated belief about a true proportion after folding in real data"
    - term: "credible interval"
      definition: "A Bayesian range that genuinely supports 'there's a 95% chance the true value is in here' - a confidence interval does not"
    - term: "confidence interval"
      definition: "A frequentist range where 95% of intervals built this way would contain the true value across many repeats - not a 95% probability statement about this one interval"

